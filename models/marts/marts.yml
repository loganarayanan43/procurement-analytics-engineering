version: 2
models:
  - name: dim_supplier
    columns:
      - name: supplier_key
        data_tests:
          - not_null
          - unique
  - name: dim_agency
    columns:
      - name: agency_key
        data_tests:
          - not_null
          - unique
  - name: dim_date
    columns:
      - name: date_key
        data_tests:
          - not_null
          - unique
  - name: fct_contract_actions
    columns:
      - name: transaction_id
        data_tests:
          - not_null
          - unique
      - name: supplier_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_key
      - name: agency_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_agency')
                field: agency_key
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
