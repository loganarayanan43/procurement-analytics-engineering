name: Static portfolio validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify-project-structure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate dbt references, PBIP visuals, DAX names and documentation
        run: python scripts/validate_repository.py
      - name: Check prescriptive threshold specification boundaries
        run: python -m unittest discover -s tests -p "test_*.py" -v
